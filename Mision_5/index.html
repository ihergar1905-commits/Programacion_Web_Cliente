<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Culinary Odyssey: busca recetas del mundo, guarda tus favoritas y crea tu propio recetario." />
    <title>Culinary Odyssey · Cocina lo que ya tienes</title>

    <!-- Tipografías del sistema de diseño (se registran como tokens en @theme) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Aplica el tema guardado ANTES de pintar, para que no haya un parpadeo claro→oscuro -->
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('culinary:theme'));
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark');
      } catch {
        /* sin localStorage: se queda en claro */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
